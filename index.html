<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Bullet Bikes Warranty</title><link rel='manifest' href='manifest.json'>
<style>body{margin:0;font-family:Arial;background:#eef3f8}header{background:linear-gradient(90deg,#0B1F3A 0 70%,#F58220 70%);color:#fff;padding:22px}section{padding:18px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0002}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccd;border-radius:8px}button{background:#F58220;color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold}.navy{background:#0B1F3A}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head>
<body><header><h1>Bullet Bikes Warranty App</h1><p>Orange / Navy Dealer Warranty System</p></header>
<section><div class='card'><div class='row'><div><label>Auto Job No</label><input id='job' readonly></div><div><label>Repair Order</label><input id='ro'></div></div><label>Customer Name</label><input id='cust'><label>VIN</label><input><label>Customer Complaint</label><textarea rows='4'></textarea><label>Diagnosis</label><textarea rows='4'></textarea><label>Repair Performed</label><textarea rows='4'></textarea><div class='row'><button onclick='email()'>Email Claim</button><button class='navy' onclick='window.print()'>Print PDF</button></div></div></section>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}const d=new Date();document.getElementById('job').value='BB-WTY-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(Math.random()*900+100);function email(){const s='Warranty '+document.getElementById('ro').value;const b='Job: '+job.value+'%0D%0ACustomer: '+cust.value;location='mailto:warranty@bulletbikes.com.au?subject='+encodeURIComponent(s)+'&body='+b}</script>
</body></html>
